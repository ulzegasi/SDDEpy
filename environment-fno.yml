name: sddepy_fno_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Keep this close to the encainca training environment, because the FNO
  # encoder is TensorFlow/GPU backed.
  - python=3.10
  - numpy
  - scipy
  - numba
  - tqdm
  - rich
  - matplotlib
  - pip
  - pip:
    - juliacall==0.9.31
    - tensorflow>=2.14
